[server]
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "viewer"

# Both themes are defined so the built-in menu (the three dots, top right -> Settings) can switch between
# Light, Dark and "Use system setting". The app's own CSS follows whichever one is active.
[theme]
font = "sans serif"

[theme.dark]
primaryColor = "#818cf8"
backgroundColor = "#0b1020"
secondaryBackgroundColor = "#121a30"
textColor = "#e6e9f2"

[theme.light]
primaryColor = "#4f46e5"
backgroundColor = "#f5f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b1f3b"
